<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case conference lab – PBS08</title>
<link rel="stylesheet" href="shared.css">
<style>
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
  .seg.chips { border: 0; gap: 6px; border-radius: 0; overflow: visible; }
  .seg.chips button { border: 1.5px solid var(--rose); border-radius: 8px; }
  .seg.chips button:last-child { border-right: 1.5px solid var(--rose); }
  .views { display: grid; grid-template-columns: 150fr 150fr 186fr; gap: 10px; align-items: stretch; }
  .vcell { position: relative; min-width: 0; display: flex; flex-direction: column; }
  .vcell .ctl { margin-top: auto; padding-top: 8px; }
  .vwrap { position: relative; background: #000; border-radius: 6px; overflow: hidden; line-height: 0; }
  .vwrap canvas { width: 100%; height: auto; display: block; cursor: crosshair; touch-action: none; }
  .vwrap .o { position: absolute; font-size: 12px; font-weight: 800; line-height: 1; color: rgba(244, 203, 201, .95); pointer-events: none; text-shadow: 0 0 3px #000; }
  .o.t { top: 5px; left: 50%; transform: translateX(-50%); } .o.b { bottom: 5px; left: 50%; transform: translateX(-50%); }
  .o.l { left: 5px; top: 50%; transform: translateY(-50%); } .o.r { right: 5px; top: 50%; transform: translateY(-50%); }
  .vcell .vt { font-size: 13.5px; font-weight: 800; margin: 0 0 3px; color: var(--muted); }
  .vcell .ctl { margin-bottom: 0; } .vcell .ctl label { font-size: 13.5px; }
  .viewseg { display: none; margin-bottom: 10px; }
  @media (max-width: 700px) { .views { grid-template-columns: minmax(0, 1fr); } .vcell { display: none; } .vcell.on { display: flex; } .viewseg { display: flex; } }
  .ctlrow { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: flex-start; margin-bottom: 12px; }
  .ctlrow .lbl { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .readout { font-size: 15.5px; margin-top: 12px; padding: 8px 12px; background: var(--pink-soft); border: 1px solid var(--grid); border-radius: 8px; min-height: 3.1em; }
  .readout b { color: var(--coral-ink); }
  .cbar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 10px; flex-wrap: wrap; }
  .cbar .g { width: 150px; height: 11px; border-radius: 3px; background: linear-gradient(90deg, #2f6db5, #e8e8e8 50%, #e8872f); border: 1px solid var(--grid); }
  .case h3 { font-size: 20px; margin-bottom: 2px; } .case .line { color: var(--coral-ink); font-weight: 800; margin-bottom: 8px; }
  .case p { margin: 0 0 8px; } .case .q { font-weight: 700; }
  details.disc { margin-top: 10px; border-top: 1px solid var(--grid); padding-top: 8px; }
  details.disc summary { cursor: pointer; font-weight: 800; color: var(--coral-ink); }
  details.disc div { margin-top: 6px; } details.disc p { margin: 0 0 6px; }
  .prof { display: grid; grid-template-columns: minmax(92px, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px; align-items: stretch; }
  .prof .hd { font-size: 13px; font-weight: 800; color: var(--muted); padding: 0 2px 2px; text-align: center; }
  .prof .hd:first-child { text-align: left; }
  .prof .nm { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; line-height: 1.15; padding-right: 4px; }
  .prof .cell { appearance: none; border: 1.5px solid var(--grid); background: var(--card); color: var(--ink); font: inherit; text-align: left; border-radius: 6px; padding: 3px 6px 5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .prof .cell:hover { border-color: var(--rose); }
  .prof .cell.sel { outline: 2px solid var(--blue); outline-offset: 1px; }
  .prof .cell.flag { border-color: var(--coral); background: var(--pink-soft); }
  .prof .cell .top { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; }
  .prof .cell .zv { font-weight: 800; font-size: 15.5px; } .prof .cell.flag .zv { color: var(--coral-ink); }
  .prof .cell .cp { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .prof .bar { position: relative; height: 6px; background: var(--grid); border-radius: 3px; }
  .prof .bar::after { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1.5px; background: var(--muted); opacity: .6; }
  .prof .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .prof .wide { grid-column: 2 / 4; }
  .flagsum { margin-top: 12px; font-size: 15.5px; }
  .flagsum b { color: var(--coral-ink); }
  .lineup { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
  .lu { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .lu .vwrap canvas { cursor: default; }
  .lu .cap { font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
  .lu .cap span { color: var(--muted); font-weight: 400; }
  .lu .btn { width: 100%; }
  .lu.pick .vwrap { outline: 3px solid var(--blue); outline-offset: 2px; }
  .lu.truth .vwrap { outline: 3px solid var(--ok); outline-offset: 2px; }
  .luout { padding: 10px 14px; border-radius: 8px; background: var(--pink-soft); border: 1px solid var(--grid); min-height: 3.2em; }
  .loading { padding: 40px 10px; text-align: center; color: var(--muted); font-weight: 700; }
  .scroll-x table.t td, .scroll-x table.t th { text-align: center; } .scroll-x table.t td:first-child, .scroll-x table.t th:first-child { text-align: left; }
  .tmpl { font-size: 13.5px; color: var(--muted); margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap" id="root">
  <noscript><p class="callout">These labs need JavaScript. Please enable it and reload.</p></noscript>
</div>
<script src="shared.js"></script>
<script src="brain_data.js"></script>
<script src="brain.js"></script>
<script>
(function () {
  const { h, f } = PBS, B = PBS.brain;
  const root = document.getElementById('root');
  const narrow = () => window.innerWidth < 700;

  /* ---------------------------------------------------------------- the reference model (schematic) ----------
     Ten regions, each on the left and the right, plus the lateral ventricles. Each region is a sphere at an approximate MNI
     position: a teaching device, not an atlas. A deviation score (z) is the person's volume minus the volume expected for their
     age and sex, divided by the normal spread. z < 0: smaller than expected. z > 0: larger than expected. */
  const REG = [
    { k: 'hip', n: 'Hippocampus', c: [26, -22, -14], r: 13 },
    { k: 'ent', n: 'Entorhinal cortex', c: [24, -8, -28], r: 11 },
    { k: 'tp', n: 'Temporal pole', c: [38, 12, -28], r: 13 },
    { k: 'lt', n: 'Lateral temporal cortex', c: [58, -30, -8], r: 18 },
    { k: 'ofc', n: 'Orbitofrontal cortex', c: [28, 36, -14], r: 14 },
    { k: 'dlp', n: 'Dorsolateral prefrontal', c: [40, 34, 28], r: 18 },
    { k: 'mpf', n: 'Medial prefrontal', c: [6, 38, 16], r: 14 },
    { k: 'pcu', n: 'Precuneus', c: [8, -58, 32], r: 17 },
    { k: 'occ', n: 'Occipital cortex', c: [22, -90, 4], r: 16 },
    { k: 'ins', n: 'Insula', c: [38, 2, 2], r: 12 },
  ];
  const THR = [{ v: 1.645, label: '5th–95th', name: 'the 5th to 95th centile' }, { v: 1.96, label: '2.5th–97.5th', name: 'the 2.5th to 97.5th centile' }, { v: 2.576, label: '0.5th–99.5th', name: 'the 0.5th to 99.5th centile' }];

  /* ---------------------------------------------------------------- eight fictional cases ----------
     z-scores are chosen by hand to tell a story (order: hip, ent, tp, lt, ofc, dlp, mpf, pcu, occ, ins; [left, right]).
     They are illustrative composites, not data from any person or study. */
  const CASES = [
    { id: 'A', head: 'Mr A, 74', line: 'Three years of slowly worsening memory',
      story: 'His wife has noticed repeated questions, missed appointments and a wrong turn on a familiar route. Everyday tasks are otherwise managed. His GP has referred him for an MRI scan.',
      q: 'Which regions are unusually small for a 74-year-old man, and does the pattern point anywhere?',
      z: { hip: [-2.6, -2.3], ent: [-2.9, -2.5], tp: [-1.2, -0.9], lt: [-1.5, -1.3], ofc: [-0.3, 0.1], dlp: [-0.6, -0.5], mpf: [-0.5, -0.7], pcu: [-1.3, -1.5], occ: [0.1, -0.3], ins: [-0.8, -0.6] }, vent: 1.9,
      read: '<p>The largest deviations are in the <b>medial temporal lobes</b> (hippocampus and entorhinal cortex), with milder loss in lateral temporal cortex and precuneus, and enlarged ventricles. That is the classic pattern of Alzheimer’s-type atrophy, which is why the hippocampus is the region most often watched in memory clinics.</p><p>The map tells you <i>where</i> volume is unusual for his age and sex. It does not tell you <i>why</i>. Vascular disease and other conditions can overlap, so a clinician would combine the map with the history, cognitive tests and other evidence.</p>' },
    { id: 'B', head: 'Ms B, 61', line: 'Two years of personality change',
      story: 'Her family describe a change in character: she has become tactless and disinhibited, eats mostly sweet foods, and seems indifferent to other people’s feelings. On formal testing her memory is relatively good.',
      q: 'How does this map differ from Case A, and what would you want to know before saying more?',
      z: { hip: [-0.5, -0.3], ent: [-1.0, -0.8], tp: [-2.2, -1.9], lt: [-0.8, -0.6], ofc: [-3.0, -2.6], dlp: [-1.5, -1.2], mpf: [-2.6, -2.3], pcu: [-0.3, -0.2], occ: [0.2, 0.0], ins: [-2.0, -1.8] }, vent: 1.3,
      read: '<p>The deviations sit in the <b>frontal lobes, the front of the temporal lobes and the insula</b>, while the hippocampus is near the reference median. That is the territory usually described in behavioural-variant frontotemporal dementia, and it is almost the opposite of Case A.</p><p>Both patients are older and both are “getting worse”, yet the total amount of loss would look similar. It is the <i>pattern</i> that separates them. A caution: early in this condition the scan can look much closer to normal than this, so a quiet map would not rule it out.</p>' },
    { id: 'C', head: 'Mr C, 66', line: 'Losing the meaning of words',
      story: 'Over eighteen months he has stopped understanding some words (“what is a pheasant?”) and can no longer name common objects. His speech is fluent and he remembers recent events well.',
      q: 'Look at both sides of the brain. What stands out?',
      z: { hip: [-1.7, -0.9], ent: [-2.3, -1.1], tp: [-3.5, -1.4], lt: [-2.8, -0.9], ofc: [-0.9, -0.4], dlp: [-0.3, 0.0], mpf: [-0.4, 0.1], pcu: [0.0, -0.2], occ: [0.3, 0.1], ins: [-1.2, -0.5] }, vent: 0.8,
      read: '<p>The loss is strongly <b>left-sided and in the front of the temporal lobe</b> (temporal pole, lateral temporal and entorhinal cortex), with the right side much milder. The asymmetry is the whole story here, and a measure averaged over both hemispheres would blur it away. The pattern fits the semantic variant of primary progressive aphasia.</p>' },
    { id: 'D', head: 'Ms D, 58', line: 'Trouble reading and judging steps',
      story: 'She struggles to read, misjudges stairs and cannot find things in a cluttered drawer. Her eyes have been checked and are normal. Her memory and insight are relatively well preserved.',
      q: 'Where is the pattern, and is it where you would look first for a memory problem?',
      z: { hip: [-0.4, -0.6], ent: [0.0, -0.2], tp: [0.3, 0.1], lt: [-0.8, -0.9], ofc: [0.1, 0.2], dlp: [-0.5, -0.7], mpf: [-0.3, -0.4], pcu: [-2.3, -2.6], occ: [-2.6, -2.9], ins: [-0.2, -0.1] }, vent: 0.9,
      read: '<p>The deviations are <b>at the back of the brain</b> (occipital cortex and precuneus), while the medial temporal lobes are spared. That posterior pattern is typical of posterior cortical atrophy, which in most people is caused by the same underlying disease as typical Alzheimer’s disease.</p><p>So one disease can give two very different maps (compare with Case A), and two different diseases can give maps that overlap. Maps describe the shape of the change, not the cause.</p>' },
    { id: 'E', head: 'Mr E, 27', line: 'Three years after a severe head injury',
      story: 'After a road-traffic collision he spent two weeks in intensive care. He now has headaches, slowed thinking and trouble concentrating. The injury was mainly on the right front side of his head.',
      q: 'Is there a “disease pattern” here? What does the map follow instead?',
      z: { hip: [-0.5, -1.4], ent: [-0.3, -0.9], tp: [0.0, -2.4], lt: [-0.2, -1.1], ofc: [-0.4, -3.2], dlp: [-0.3, -1.8], mpf: [-0.7, -1.3], pcu: [-0.2, -0.3], occ: [0.3, 0.1], ins: [0.0, -1.5] }, vent: 1.6,
      read: '<p>The deviations are <b>focal and one-sided</b>: right orbitofrontal and right anterior temporal cortex, with a mild increase in ventricle size. The map follows the injury, not a named disease.</p><p>This is why a group of people with traumatic brain injury is hard to summarise with an average: every person’s map is different (Lab 4). An individual deviation map keeps that information.</p>' },
    { id: 'F', head: 'Mrs F, 70', line: 'A volunteer with no symptoms',
      story: 'She is a participant in a community cohort. She has no memory complaints and a normal cognitive screen. Her scan is part of the research dataset; no one referred her for anything.',
      q: 'One region is flagged. Should that worry anyone?',
      z: { hip: [-0.7, -0.4], ent: [-0.5, -0.9], tp: [0.2, -0.3], lt: [-2.1, -0.6], ofc: [0.4, 0.0], dlp: [-0.8, 0.3], mpf: [0.1, -0.2], pcu: [-0.9, -0.4], occ: [0.6, 0.2], ins: [-0.3, -0.9] }, vent: 0.5,
      read: '<p>There is a single flag (left lateral temporal cortex, z −2.1) among 21 measures. With a two-sided cut-off at the 2.5th and 97.5th centiles, each measure has a 5% chance of being flagged in a perfectly healthy person. Across 21 measures that adds up: if they were independent, about two in three healthy people would have at least one flag (regions are correlated, so the true figure is lower, but still far from rare).</p><p>A lone flag in a person without symptoms, with no pattern in the neighbouring or matching regions, is what chance looks like. Look for <i>pattern</i> and for <i>agreement with the rest of the picture</i>.</p>' },
    { id: 'G', head: 'Mr G, 34', line: 'First episode of psychosis',
      story: 'He is six weeks into treatment after his first episode of psychosis, with no neurological symptoms. His scan was acquired for a research study.',
      q: 'Nothing is flagged. Is the scan normal?',
      z: { hip: [-0.9, -0.7], ent: [-0.5, -0.3], tp: [-0.7, -0.4], lt: [-0.6, -0.8], ofc: [-0.8, -0.5], dlp: [-0.9, -0.7], mpf: [-0.7, -0.9], pcu: [-0.4, -0.6], occ: [-0.2, -0.4], ins: [-0.8, -1.0] }, vent: 0.9,
      read: '<p>No region is flagged at any of the three cut-offs, yet <b>every region sits a little below the reference and the ventricles a little above it</b>. In one person that is weak evidence. Across a group of patients it adds up to the small average differences reported in case–control studies of psychosis (the diffuse-shift group in Lab 4).</p><p>A flag count would miss this. The profile as a whole carries more information than the flags do. And a normative model cannot say whether the shift comes from the condition, from treatment or from lifestyle.</p>' },
    { id: 'H', head: 'Ms H, 47', line: 'A healthy volunteer from a new scanner',
      story: 'She is a healthy volunteer with no symptoms. She was scanned at a hospital that was not part of the reference dataset, using a different sequence from most of the reference scans.',
      q: 'The brain looks uniformly small. What is the most likely explanation?',
      z: { hip: [-1.4, -1.2], ent: [-1.0, -1.5], tp: [-1.6, -1.3], lt: [-1.2, -1.4], ofc: [-1.7, -1.1], dlp: [-1.3, -1.5], mpf: [-1.0, -1.4], pcu: [-1.5, -1.2], occ: [-1.6, -1.0], ins: [-1.3, -1.1] }, vent: 1.1,
      read: '<p>Every region is shifted down by about the same amount and the ventricles are up: a <b>global shift with no regional focus</b>. Real brains rarely change like that at 47, but scanners and pipelines do. This is the scanner fingerprint of Labs 2 and 3, now showing up in a z-score map.</p><p>The remedy is to include the new site in the model (calibrating on a small sample of healthy people from that site) or to harmonise the data first. Until then, read nothing into the map.</p>' },
  ];

  /* ---------------------------------------------------------------- state and helpers */
  const S = { ci: 0, thr: 1.96, mode: 'flag', pos: [0, 0, 0], view: 'ax', sel: null };
  const REGN = new Map(REG.map((r) => [r.k, r]));
  const sideName = (side) => (side === 0 ? 'Left' : 'Right');
  const zs = (z) => (z > 0 ? '+' : '') + f(z, 1);
  const cent = (z) => { const p = PBS.normCdf(z) * 100; return p < 1 || p > 99 ? p.toFixed(1) + 'th' : PBS.ord(Math.round(p)); };
  const flagged = (z, thr) => Math.abs(z) >= (thr || S.thr) - 1e-9;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function toBlobs(zmap, vz) {
    const list = []; let ssum = 0, sn = 0;
    for (const r of REG) for (let sd = 0; sd < 2; sd++) {
      const z = zmap[r.k][sd]; ssum += z; sn++;
      list.push({ c: [(sd === 0 ? -1 : 1) * r.c[0], r.c[1], r.c[2]], r: r.r, z, a: z < -0.3 ? clamp((-z - 0.3) / 2.7, 0, 1) : 0, id: r.k + sd });
    }
    return { blobs: B.prep(list), vent: { e: clamp(1.25 * vz, 0, 5), z: vz }, widen: 0.08 * Math.max(0, -ssum / sn) };
  }
  const caseModel = (c) => toBlobs(c.z, c.vent);
  function flagCount(c, thr) { let n = 0; for (const r of REG) for (let sd = 0; sd < 2; sd++) if (flagged(c.z[r.k][sd], thr)) n++; if (flagged(c.vent, thr)) n++; return n; }

  /* ---------------------------------------------------------------- page head */
  root.append(
    h('h1', {}, 'Case conference: reading deviation maps'),
    h('p', { class: 'sub' }, 'Eight fictional people, each with a brain scan and a deviation map. Work out what each map shows, what it cannot show, and how easily chance can look like a pattern.'),
    h('div', { class: 'callout' }, h('b', {}, 'What is real here, and what is not. '), 'The brain is a real MRI: the open ICBM152 average of 152 healthy young adults. The people are not real. Each case is an illustrative composite whose region-by-region z-scores were written by hand to tell a story, and the tissue loss you see in the scan was drawn in from those scores. No image here is a scan of a patient, and real scans are less tidy than these.'));

  /* ---------------------------------------------------------------- case chips */
    const chips = PBS.seg({ label: 'Case', value: 0, options: CASES.map((c, i) => ({ v: i, label: 'Case ' + c.id })), onChange: (v) => setCase(v) });
  chips.classList.add('chips');
  root.append(chips);

  /* ---------------------------------------------------------------- viewer */
  const sc = () => (narrow() ? 2 : 1.5);
  const viewCells = {}, canv = {}, slid = {}, slices = {};
  const AXN = ['x', 'y', 'z'];
  const orient = { ax: { t: 'A', b: 'P', l: 'L', r: 'R' }, cor: { t: 'S', b: 'I', l: 'L', r: 'R' }, sag: { t: 'S', b: 'I', l: 'A', r: 'P' } };
  const vtitle = { ax: 'Axial (from above)', cor: 'Coronal (from the front)', sag: 'Sagittal (from the side)' };
  const viewsBox = h('div', { class: 'views' });
  const viewSeg = PBS.seg({ label: 'View', value: 'ax', options: [{ v: 'ax', label: 'Axial' }, { v: 'cor', label: 'Coronal' }, { v: 'sag', label: 'Sagittal' }], onChange: (v) => { S.view = v; syncViewCells(); drawAll(); } });
  viewSeg.classList.add('viewseg');
  function syncViewCells() { for (const v of ['ax', 'cor', 'sag']) viewCells[v].classList.toggle('on', v === S.view); }

  for (const v of ['ax', 'cor', 'sag']) {
    const cv = h('canvas', { width: 10, height: 10, 'aria-label': vtitle[v] + ' slice of the template brain' });
    canv[v] = cv;
    const o = orient[v];
    const wrap = h('div', { class: 'vwrap' }, cv, h('span', { class: 'o t' }, o.t), h('span', { class: 'o b' }, o.b), h('span', { class: 'o l' }, o.l), h('span', { class: 'o r' }, o.r));
    const fixed = B.VIEWS[v].f;
    const sl = PBS.slider({ label: AXN[fixed] + ' slice', min: 0, max: 1, value: 0, fmt: (x) => x + ' mm', onInput: (x) => { S.pos[fixed] = x; drawAll(); } });
    slid[v] = sl;
    const cell = h('div', { class: 'vcell' }, h('div', { class: 'vt' }, vtitle[v]), wrap, sl);
    viewCells[v] = cell; viewsBox.append(cell);
    const pick = (e) => {
      const S1 = slices[v]; if (!S1) return;
      const r = cv.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width * S1.w, py = (e.clientY - r.top) / r.height * S1.h;
      const m = S1.toMm(px, py), V = B.VIEWS[v];
      S.pos[V.a] = Math.round(m[V.a]); S.pos[V.b] = Math.round(m[V.b]); S.sel = null;
      syncSliders(); drawAll(); renderProfile();
    };
    let down = false;
    cv.addEventListener('pointerdown', (e) => { down = true; try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ok */ } pick(e); });
    cv.addEventListener('pointermove', (e) => { if (down) pick(e); });
    cv.addEventListener('pointerup', () => { down = false; });
    cv.addEventListener('pointercancel', () => { down = false; });
  }
  function syncSliders() {
    for (const v of ['ax', 'cor', 'sag']) {
      const fx = B.VIEWS[v].f, sl = slid[v];
      sl.input.min = B.range[fx][0]; sl.input.max = B.range[fx][1]; sl.set(clamp(S.pos[fx], B.range[fx][0], B.range[fx][1]));
    }
  }

  const modeSeg = PBS.seg({ label: 'Show', value: 'flag', options: [{ v: 'none', label: 'Scan only' }, { v: 'flag', label: 'Flagged regions' }, { v: 'all', label: 'All deviations' }, { v: 'tpl', label: 'Reference brain' }], onChange: (v) => { S.mode = v; drawAll(); } });
  modeSeg.classList.add('chips');
  const thrSeg = PBS.seg({ label: 'Flag threshold', value: 1.96, options: THR.map((t) => ({ v: t.v === 1.96 ? 1.96 : t.v, label: t.label })), onChange: (v) => { S.thr = v; drawAll(); renderProfile(); renderCounts(); } });
  const readout = h('div', { class: 'readout', 'aria-live': 'polite' });
  const cbar = h('div', { class: 'cbar' }, h('span', {}, 'z −3 (smaller than expected)'), h('span', { class: 'g' }), h('span', {}, 'z +3 (larger than expected)'));
  const viewerBody = h('div', {}, h('div', { class: 'loading', id: 'loading' }, 'Loading the template brain…'));
  const viewerCard = PBS.card('The scan', viewerBody);
  const stage = h('div', { hidden: true }, viewSeg, viewsBox,
    h('div', { class: 'ctlrow', style: { marginTop: '12px' } },
      h('div', {}, h('div', { class: 'lbl' }, 'Show'), modeSeg),
      h('div', {}, h('div', { class: 'lbl' }, 'Flag a region when it is outside'), thrSeg)),
    cbar, readout,
    h('p', { class: 'tmpl' }, 'Click or drag on any view to move the crosshair, or click a score in the table. The “reference brain” is the unchanged template. Everything else is the template with simulated tissue loss drawn in.'));
  viewerBody.append(stage);

  /* ---------------------------------------------------------------- case panel and profile */
  const caseBody = h('div', { class: 'case' });
  const profBody = h('div', {});
  const flagsum = h('div', { class: 'flagsum', 'aria-live': 'polite' });
  profBody.append(h('p', { class: 'small', style: { marginTop: 0 } }, 'Each box is a deviation score (z) and its centile, from a reference model for age and sex. Blue: smaller than expected. Orange: larger.'), h('div', { class: 'prof', id: 'prof' }), flagsum);
  const side = h('div', { class: 'stack' }, PBS.card('The case', caseBody), PBS.card('Deviation scores', profBody));
  root.append(h('div', { class: 'lab wide-controls' }, viewerCard, side));

  function renderCase() {
    const c = CASES[S.ci]; PBS.clear(caseBody);
    caseBody.append(h('h3', {}, c.head), h('div', { class: 'line' }, c.line), h('p', {}, c.story), h('p', { class: 'q' }, 'Question: ' + c.q),
      h('details', { class: 'disc' }, h('summary', {}, 'Read the discussion'), h('div', { html: c.read }),
        h('p', { class: 'small', html: '<i>Illustrative composite: not a real patient.</i>' })));
  }
  function barEl(z) {
    const wdt = Math.min(Math.abs(z), 4) / 4 * 50;
    return h('span', { class: 'bar' }, h('i', { style: z < 0 ? { right: '50%', width: wdt + '%', background: 'var(--blue)' } : { left: '50%', width: wdt + '%', background: 'var(--orange)' } }));
  }
  function cellEl(z, key, label) {
    const fl = flagged(z);
    const b = h('button', { type: 'button', class: 'cell' + (fl ? ' flag' : '') + (S.sel === key ? ' sel' : ''), 'aria-label': label + ': z ' + zs(z) + ', ' + cent(z) + ' centile' + (fl ? ', flagged' : '') },
      h('span', { class: 'top' }, h('span', { class: 'zv' }, zs(z)), h('span', { class: 'cp' }, cent(z))), barEl(z));
    b.dataset.key = key;
    return b;
  }
  function renderProfile() {
    const c = CASES[S.ci], box = document.getElementById('prof'); PBS.clear(box);
    box.append(h('div', { class: 'hd' }, 'Region'), h('div', { class: 'hd' }, 'Left'), h('div', { class: 'hd' }, 'Right'));
    for (const r of REG) {
      box.append(h('div', { class: 'nm' }, r.n));
      for (let sd = 0; sd < 2; sd++) {
        const key = r.k + sd, cell = cellEl(c.z[r.k][sd], key, sideName(sd) + ' ' + r.n.toLowerCase());
        cell.addEventListener('click', () => { S.sel = key; S.pos = [(sd === 0 ? -1 : 1) * r.c[0], r.c[1], r.c[2]]; syncSliders(); drawAll(); renderProfile(); });
        box.append(cell);
      }
    }
    box.append(h('div', { class: 'nm' }, 'Lateral ventricles'));
    const vc = cellEl(c.vent, 'vent', 'Lateral ventricles'); vc.classList.add('wide');
    vc.addEventListener('click', () => { S.sel = 'vent'; S.pos = [-9, -12, 14]; syncSliders(); drawAll(); renderProfile(); });
    box.append(vc);
    const lst = []; for (const r of REG) for (let sd = 0; sd < 2; sd++) if (flagged(c.z[r.k][sd])) lst.push(sideName(sd).toLowerCase() + ' ' + r.n.toLowerCase());
    if (flagged(c.vent)) lst.push('lateral ventricles (larger)');
    const n = lst.length, tn = THR.find((t) => Math.abs(t.v - S.thr) < 0.01).name;
    PBS.clear(flagsum);
    flagsum.append(h('b', {}, n + ' of 21 measures'), ' outside ' + tn + (n ? ': ' + lst.join('; ') + '.' : '.'),
      h('div', { class: 'small', style: { marginTop: '4px' } }, 'A perfectly healthy person is expected to have about ' + f(21 * 2 * (1 - PBS.normCdf(S.thr)), 1) + ' flags among 21 measures at this threshold, if the measures were independent.'));
  }

  /* ---------------------------------------------------------------- drawing */
  let model = null;
  function drawView(v) {
    const plain = S.mode === 'tpl';
    const S1 = B.slice(v, S.pos[B.VIEWS[v].f], { blobs: plain ? [] : model.blobs, vent: plain ? null : model.vent, widen: plain ? 0 : model.widen, plain, scale: sc() });
    slices[v] = S1;
    B.paint(canv[v], S1, { overlay: plain ? 'none' : (S.mode === 'none' ? 'none' : S.mode), thr: S.thr, cross: S1.toPix(S.pos) });
  }
  function drawReadout() {
    const c = CASES[S.ci], [x, y, z] = S.pos, pre = 'Crosshair at x ' + f(x, 0) + ', y ' + f(y, 0) + ', z ' + f(z, 0) + ' mm. ';
    const dv = B.ventDist(x, y, z);
    let txt;
    if (dv <= Math.max(model.vent.e, 0) + 0.6) txt = '<b>Lateral ventricles</b>: z ' + zs(c.vent) + ', ' + cent(c.vent) + ' centile' + (flagged(c.vent) ? ', <b>flagged</b>.' : ', not flagged.');
    else {
      const bl = B.regionAt(model.blobs, x, y, z, 0.3);
      if (bl) { const r = REGN.get(bl.id.slice(0, -1)), sd = Number(bl.id.slice(-1)); txt = '<b>' + sideName(sd) + ' ' + r.n.toLowerCase() + '</b>: z ' + zs(bl.z) + ', ' + cent(bl.z) + ' centile' + (flagged(bl.z) ? ', <b>flagged</b>.' : ', not flagged.'); }
      else txt = 'Outside the ten regions in this schematic model, so no score here.';
    }
    readout.innerHTML = pre + txt;
  }
  function drawAll() {
    if (!B.loaded || !model) return;
    for (const v of ['ax', 'cor', 'sag']) drawView(v);
    drawReadout();
  }
  function setCase(i) {
    S.ci = i; chips.set(i); model = caseModel(CASES[i]);
    // jump the crosshair to the most deviant region
    let best = null, bz = -1;
    for (const r of REG) for (let sd = 0; sd < 2; sd++) { const z = Math.abs(CASES[i].z[r.k][sd]); if (z > bz) { bz = z; best = [r, sd]; } }
    S.pos = [(best[1] === 0 ? -1 : 1) * best[0].c[0], best[0].c[1], best[0].c[2]]; S.sel = best[0].k + best[1];
    renderCase(); renderProfile(); if (B.loaded) { syncSliders(); drawAll(); }
  }

  /* ---------------------------------------------------------------- flag-count table (live) */
  const countBox = h('div', { class: 'scroll-x' });
  function renderCounts() {
    PBS.clear(countBox);
    const tb = h('table', { class: 't' }, h('thead', {}, h('tr', {}, h('th', {}, 'Case'), THR.map((t) => h('th', { class: 'n' }, 'outside ' + t.label)), h('th', { class: 'n' }, 'mean z'))),
      h('tbody', {}, CASES.map((c, i) => {
        let sum = 0, n = 0; for (const r of REG) for (let sd = 0; sd < 2; sd++) { sum += c.z[r.k][sd]; n++; }
        return h('tr', { style: i === S.ci ? { background: 'var(--pink-soft)' } : null }, h('td', {}, h('b', {}, c.id), ' · ' + c.head + ', ' + c.line.toLowerCase()), THR.map((t) => h('td', { class: 'n' }, String(flagCount(c, t.v)))), h('td', { class: 'n' }, f(sum / n, 2)));
      })));
    countBox.append(tb);
  }

  /* ---------------------------------------------------------------- tasks */
  const tasks = h('div', { class: 'tasks' },
    h('h2', {}, 'Guided tasks'),
    PBS.doTask({ tag: 'Look first', title: '1. Can you see it with your own eyes?',
      doit: '<b>Do this:</b> choose Case A and set Show to “Scan only”. Scroll the coronal slice slider from front to back for about twenty seconds and look at the temples, then at the ventricles. Then switch to “Flagged regions”.',
      reveal: 'The enlarged ventricles are easy to see. The hippocampal loss is much harder, even though it is a large deviation (z around −2.5). Switching on the map points you straight to it. That is the practical gain of a normative model: it turns “does that look small?” into a number with a known spread.' }),
    PBS.task({ tag: 'Predict', title: '2. Case F is a healthy 70-year-old volunteer with one flagged region. What is the best reading?',
      body: '<p class="small">Choose Case F. The default threshold flags anything outside the 2.5th to 97.5th centile.</p>',
      options: [
        { t: 'An early sign of disease: one flag is enough to follow up urgently', fb: 'A single flag does not carry that much weight here. Each of the 21 measures has its own chance of being flagged, so some flags are expected in healthy people.' },
        { t: 'Probably chance: with 21 measures, one flag is common in healthy people', ok: true, fb: 'At this threshold each measure has about a 5% chance of being flagged in a healthy person, so about one flag in 21 measures is expected. A lone flag with no pattern is weak evidence. Raise the threshold to the 0.5th–99.5th and watch it disappear.' },
        { t: 'A scanner artefact, because the flag is only on one side', fb: 'One-sided flags are common by chance and do not point to the scanner. A scanner problem would normally shift many regions together (Case H).' }] }),
    PBS.task({ tag: 'Predict', title: '3. Case G has no flagged regions at any threshold. Does that make the scan “normal”?',
      options: [
        { t: 'Yes: no flags means nothing unusual', fb: 'Look at the whole column of scores and the mean z in the table below. Every region is below zero.' },
        { t: 'No: all 20 regional scores are below zero and the ventricles are up, which is itself informative', ok: true, fb: 'For a healthy person you expect a mixture of positive and negative scores. All twenty regional scores being negative would be very unlikely by chance if regions were independent (they are correlated, so it is less extreme than that). A threshold on single regions throws that information away.' },
        { t: 'Yes, but only because the threshold is too strict', fb: 'Try the 5th–95th threshold. Still no flags. The information is in the shared direction of all the scores, not in any one of them.' }] }),
    PBS.task({ tag: 'Predict', title: '4. Case H is a healthy 47-year-old whose every region is smaller than expected. What is the most likely explanation?',
      body: '<p class="small">Read the story, then compare the scores with Case A. Which regions are lowest?</p>',
      options: [
        { t: 'Early dementia, because every region is reduced', fb: 'Dementia maps have a shape (Cases A to D). Here the deviation is spread evenly, and she is 47 and well.' },
        { t: 'A site effect: the new scanner and sequence are not in the reference model', ok: true, fb: 'An even shift across every region, in a healthy person from a site the model has never seen, is the signature of a scanner or pipeline difference. Lab 3 shows how an image can change in this way. The fix is calibration or harmonisation, not a diagnosis.' },
        { t: 'Normal ageing', fb: 'Ageing is already built into the model: z is relative to what is expected at her age and sex, so ordinary ageing should give z near zero.' }] }),
    h('div', { class: 'task' }, h('span', { class: 'tag' }, 'Try'), h('h3', {}, '5. How much does the threshold matter?'),
      h('div', { class: 'do', html: '<b>Do this:</b> switch the threshold between the three settings and read the flag counts below. Which cases keep their flags at the strictest setting? Which lose them all?' }), countBox,
      h('details', { class: 'more', style: { marginTop: '8px' } }, h('summary', {}, 'What to notice'), h('div', { style: { marginTop: '6px' }, html: 'The strict threshold keeps the cases with a real pattern (A to E) and removes the isolated flag in Case F. Cases G and H never had flags, yet G is different from H: G has a mild shift in every region and H a larger one. A flag count is a blunt tool, which is why Lecture 6 looks at what happens when a deviation score is turned into a yes-or-no flag.' })))
  );

  /* ---------------------------------------------------------------- lineup challenge */
  const LU = { strength: 1.2, seed: 0, target: 0, picked: null, tally: { n: 0, ok: 0 }, maps: [] };
  const luBox = h('div', { class: 'lineup' }), luOut = h('div', { class: 'luout', 'aria-live': 'polite' });
  const luSlider = PBS.slider({ label: 'Strength of the real pattern (shift in z)', min: 0, max: 2.5, step: 0.1, value: LU.strength, fmt: (v) => f(v, 1), hint: '0 means nobody has a pattern; 2 is easy to see.', onInput: (v) => { LU.strength = v; } });
  const luCanv = [], luCells = [];
  function luNew() {
    LU.seed = Math.floor(Math.random() * 1e9); const rg = PBS.rng(LU.seed); LU.target = rg.int(6); LU.picked = null; LU.maps = [];
    for (let i = 0; i < 6; i++) {
      const z = {}; for (const r of REG) z[r.k] = [rg.n(), rg.n()]; let vz = rg.n();
      if (i === LU.target) {
        const s = LU.strength; for (const sd of [0, 1]) { z.hip[sd] -= s; z.ent[sd] -= s; z.lt[sd] -= 0.6 * s; z.tp[sd] -= 0.6 * s; } vz += 0.7 * s;
      }
      for (const r of REG) for (const sd of [0, 1]) z[r.k][sd] = Math.round(z[r.k][sd] * 10) / 10; vz = Math.round(vz * 10) / 10;
      const fc = flagCount({ z, vent: vz }, 1.96);
      LU.maps.push({ z, vz, model: toBlobs(z, vz), flags: fc });
    }
    luDraw(); luOut.textContent = 'Which person has a genuine pattern of loss in the temporal lobes? Five are healthy people drawn at random.';
  }
  function luDraw() {
    PBS.clear(luBox); luCanv.length = 0; luCells.length = 0;
    LU.maps.forEach((m, i) => {
      const cv = h('canvas', { width: 10, height: 10, 'aria-label': 'Person ' + (i + 1) + ' axial map' });
      const S1 = B.slice('ax', -16, { blobs: m.model.blobs, vent: m.model.vent, widen: m.model.widen, scale: narrow() ? 1.4 : 1.1 });
      B.paint(cv, S1, { overlay: 'all' });
      const rev = LU.picked !== null;
      const cap = h('div', { class: 'cap' }, h('b', {}, 'Person ' + (i + 1)), rev ? h('span', {}, m.flags + ' flag' + (m.flags === 1 ? '' : 's') + (i === LU.target ? ' · pattern' : '')) : null);
      const btn = h('button', { type: 'button', class: 'btn sm alt', disabled: rev }, 'This one');
      btn.addEventListener('click', () => luPick(i));
      const cell = h('div', { class: 'lu' + (rev && i === LU.picked ? ' pick' : '') + (rev && i === LU.target ? ' truth' : '') }, h('div', { class: 'vwrap' }, cv, h('span', { class: 'o l' }, 'L'), h('span', { class: 'o r' }, 'R')), cap, btn);
      luBox.append(cell); luCanv.push(cv); luCells.push(cell);
    });
  }
  function luPick(i) {
    if (LU.picked !== null) return;
    LU.picked = i; LU.tally.n++; const ok = i === LU.target; if (ok) LU.tally.ok++;
    luDraw();
    const healthy = LU.maps.filter((_, j) => j !== LU.target).map((m) => m.flags), tf = LU.maps[LU.target].flags;
    luOut.innerHTML = (ok ? '<b>You found it.</b> ' : '<b>Not this time.</b> The pattern was in person ' + (LU.target + 1) + '. ') + 'The person with the pattern had ' + tf + ' flag' + (tf === 1 ? '' : 's') + '; the five healthy people had ' + healthy.join(', ') + '. At strength ' + f(LU.strength, 1) + ', ' + (healthy.some((x) => x >= tf) ? 'at least one healthy person had as many flags as the patient, so counting flags alone would not have found them.' : 'counting flags would have picked them out, but only just.') + ' Your score so far: ' + LU.tally.ok + ' of ' + LU.tally.n + ' (guessing would get about one in six).';
  }
  const luCard = PBS.card('Lineup: spot the real pattern',
    h('div', {}, h('p', { style: { marginTop: 0 } }, 'This is how statisticians test whether a pattern in a picture is real: hide the true one among decoys made from random draws. Six axial slices at the level of the temporal lobes, each with its deviation map. One person has a real temporal pattern added on top of the usual random variation; five do not.'),
      h('div', { class: 'ctlrow' }, h('div', { style: { minWidth: '240px', flex: '1 1 260px' } }, luSlider), h('div', {}, h('button', { class: 'btn', type: 'button', id: 'lunew' }, 'New lineup'))),
      luBox, luOut));
  luCard.style.marginTop = '24px';
  const luTask = PBS.doTask({ tag: 'Try', title: '6. How weak can the pattern be before you cannot find it?',
    doit: '<b>Do this:</b> play five rounds at strength 2.0, then five at 1.0, then five at 0.5. Keep your score for each.',
    reveal: 'Expect to do well at 2.0, to start missing at 1.0, and to drift towards guessing (one in six) as the strength approaches zero. Random variation in healthy people can look like a pattern, and a real but modest pattern can look like random variation. This is the same problem as in Lab 4: individual maps are informative but noisy, which is why a flag needs a story and not just a number.' });

  root.append(tasks, luCard, h('div', { class: 'tasks', style: { marginTop: '14px' } }, luTask));
  root.append(PBS.takeaway([
    'The same brain can carry very different deviation maps: where the loss is matters as much as how much there is (Cases A to D).',
    'A single flagged region in a person without symptoms is what chance looks like: with many measures, flags are common in healthy people.',
    'A diffuse shift (Case G) can have no flags and still be informative, and a uniform shift in a person from a new site (Case H) is a scanner effect until proven otherwise.',
    'A deviation map says where and how unusual, not why. It supports a clinical judgement; it does not replace one.']));
  root.append(h('p', { class: 'src', html: 'Template: ICBM152 2009a nonlinear symmetric T1 (average of 152 healthy young adults). Fonov et al. (2009), NeuroImage 47, S102; Fonov et al. (2011), NeuroImage 54, 313–327. Copyright 1993–2004 Louis Collins, McConnell Brain Imaging Centre, Montreal Neurological Institute, McGill University; used under its permission to copy and distribute with the copyright notice. Tissue loss, deviation maps and all cases are simulated by the course for teaching. Idea of the lineup protocol: Buja et al. (2009), Phil Trans R Soc A 367, 4361–4383.' }));

  PBS.frame('casebook', root);
  renderCounts();
  setCase(0);
  document.getElementById('lunew').addEventListener('click', luNew);

  B.load().then(() => {
    stage.hidden = false; document.getElementById('loading').remove();
    S.view = 'ax'; syncViewCells(); syncSliders(); drawAll(); luNew();
  }).catch((e) => { document.getElementById('loading').textContent = 'The template brain could not be loaded: ' + e.message; });
  let rt = null;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (B.loaded) { syncViewCells(); drawAll(); luDraw(); } }, 150); });
  window.__lab = { S, CASES, REG, THR, setCase, drawAll, LU, luNew, luPick, flagCount, B, model: () => model };
})();
</script>
