<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot the Bad Practice — Open Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0c0f1a;
    --bg-secondary: #141829;
    --bg-card: #1a1f35;
    --bg-card-hover: #1e2440;
    --border: rgba(255,255,255,0.06);
    --border-active: rgba(99,102,241,0.4);
    --text-primary: #f1f3f9;
    --text-secondary: #8b92ab;
    --text-muted: #5c6380;
    --accent: #6366f1;
    --accent-light: #818cf8;
    --accent-glow: rgba(99,102,241,0.15);
    --correct: #10b981;
    --correct-soft: rgba(16,185,129,0.1);
    --correct-border: rgba(16,185,129,0.25);
    --wrong: #ef4444;
    --wrong-soft: rgba(239,68,68,0.1);
    --wrong-border: rgba(239,68,68,0.25);
    --warning: #f59e0b;
    --radius: 16px;
    --radius-sm: 10px;
    --radius-xs: 6px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(99,102,241,0.06), transparent),
      radial-gradient(ellipse 50% 40% at 80% 100%, rgba(16,185,129,0.04), transparent);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-glow);
    border: 1px solid var(--border-active);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--accent-light);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 2.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    background: linear-gradient(135deg, #f1f3f9 0%, #818cf8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 1.05rem;
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Score bar */
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 20px;
    padding: 16px 24px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .score-item { text-align: center; }
  .score-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    font-weight: 700;
  }
  .score-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .green { color: var(--correct); }
  .purple { color: var(--accent-light); }

  /* Progress dots */
  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.1);
    transition: all 0.3s ease;
  }
  .dot.current {
    background: var(--accent);
    border-color: var(--accent);
    transform: scale(1.4);
    box-shadow: 0 0 12px rgba(99,102,241,0.4);
  }
  .dot.answered-correct {
    background: var(--correct);
    border-color: var(--correct);
  }
  .dot.answered-wrong {
    background: var(--wrong);
    border-color: var(--wrong);
  }

  /* Question card */
  .q-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 20px;
    animation: fadeUp 0.35s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .q-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 0.8rem;
    font-weight: 700;
    margin-bottom: 16px;
  }

  .scenario-text {
    font-size: 1rem;
    line-height: 1.75;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.02);
    padding: 20px 24px;
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--accent);
    margin-bottom: 24px;
  }

  /* Options */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  @media (max-width: 560px) {
    .options { grid-template-columns: 1fr; }
  }

  .option-btn {
    padding: 16px 20px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .option-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.02));
    opacity: 0;
    transition: opacity 0.2s;
  }
  .option-btn:hover {
    border-color: var(--border-active);
    background: var(--bg-card-hover);
    color: var(--text-primary);
    transform: translateY(-1px);
  }
  .option-btn:hover::before { opacity: 1; }

  .option-btn.correct {
    border-color: var(--correct-border);
    background: var(--correct-soft);
    color: var(--correct);
    pointer-events: none;
    animation: correctBounce 0.4s ease;
  }
  .option-btn.wrong {
    border-color: var(--wrong-border);
    background: var(--wrong-soft);
    color: var(--wrong);
    pointer-events: none;
    opacity: 0.7;
  }
  .option-btn.disabled-neutral {
    pointer-events: none;
    opacity: 0.4;
  }

  @keyframes correctBounce {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* Feedback */
  .feedback {
    padding: 20px 24px;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    line-height: 1.7;
    animation: fadeUp 0.35s ease;
  }
  .feedback.correct-fb {
    background: var(--correct-soft);
    border: 1px solid var(--correct-border);
    color: #a7f3d0;
  }
  .feedback.wrong-fb {
    background: var(--wrong-soft);
    border: 1px solid var(--wrong-border);
    color: #fca5a5;
  }
  .feedback strong { color: inherit; filter: brightness(1.3); }

  /* Navigation */
  .nav-buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }
  .nav-btn {
    padding: 12px 28px;
    border-radius: var(--radius-sm);
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn.primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px rgba(99,102,241,0.25);
  }
  .nav-btn.primary:hover {
    background: var(--accent-light);
    transform: translateY(-1px);
  }
  .nav-btn.secondary {
    background: var(--bg-card);
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .nav-btn.secondary:hover { color: var(--text-primary); background: var(--bg-card-hover); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }

  /* Final screen */
  .final-screen {
    text-align: center;
    padding: 48px 32px;
    display: none;
    animation: fadeUp 0.5s ease;
  }
  .final-screen h2 {
    font-size: 1.8rem;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 12px;
  }
  .final-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 4rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--correct));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  .final-message {
    font-size: 1.05rem;
    color: var(--text-secondary);
    margin-bottom: 32px;
    line-height: 1.7;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  .trophy { font-size: 3rem; margin-bottom: 16px; }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
  }
  .footer a { color: var(--accent-light); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Interactive Quiz
    </div>
    <h1>Spot the Bad Practice</h1>
    <p class="subtitle">Can you identify the questionable research practice in each scenario?</p>
  </div>

  <div class="score-bar">
    <div class="score-item">
      <div class="score-num green" id="scoreCorrect">0</div>
      <div class="score-label">Correct</div>
    </div>
    <div class="score-item">
      <div class="score-num purple" id="scoreTotal">0 / 5</div>
      <div class="score-label">Progress</div>
    </div>
  </div>

  <div class="progress-dots" id="progressDots"></div>

  <div id="quizArea"></div>

  <div class="final-screen" id="finalScreen">
    <div class="trophy" id="trophy"></div>
    <h2>Quiz Complete!</h2>
    <div class="final-score" id="finalScore"></div>
    <div class="final-message" id="finalMessage"></div>
    <button class="nav-btn primary" onclick="restartQuiz()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      Try Again
    </button>
  </div>

  <div class="footer">
    Open Science Lab &middot; University of Cambridge &middot; <a href="https://github.com/marcellamontagnese/teaching-open-science-lab">View on GitHub</a>
  </div>
</div>

<script>
const scenarios = [
  {
    text: "A research team measured 12 different cognitive outcomes in their brain stimulation study. Only the reaction time measure reached p = .03. In their paper, they reported only the reaction time finding, framing it as their primary hypothesis.",
    options: ["P-hacking", "HARKing", "Publication bias", "Data fabrication"],
    correct: 0,
    correctFeedback: "This is <strong>p-hacking</strong> \u2014 measuring many outcomes but only reporting the one that reached significance. By testing 12 outcomes at \u03B1 = .05, the probability of at least one false positive is 1 \u2212 (0.95)\u00B9\u00B2 = 46%. All 12 measures should be reported with a correction for multiple comparisons.",
    wrongFeedback: "Not quite. This is <strong>p-hacking</strong>. The researchers measured 12 outcomes but only reported the significant one, inflating the false positive rate. It also has elements of HARKing, but the core issue is selective reporting of multiple tests."
  },
  {
    text: "A PhD student found that their memory experiment showed no significant effect of sleep deprivation on recall (p = .34). After looking at the data, they noticed that when they split participants by age, the older group showed a significant effect (p = .02). They rewrote their introduction to frame age-dependent memory effects as their main research question.",
    options: ["P-hacking", "HARKing", "Publication bias", "Falsification"],
    correct: 1,
    correctFeedback: "This is <strong>HARKing</strong> (Hypothesising After the Results are Known). The student discovered the age effect through post-hoc exploration, then rewrote the paper to make it look like a prediction. The honest approach: report it as exploratory and replicate in a new study.",
    wrongFeedback: "This is <strong>HARKing</strong> \u2014 Hypothesising After the Results are Known. The student discovered the age effect through exploration but presented it as if predicted from the start. There's overlap with p-hacking (subsetting the data), but the key issue is rewriting the hypothesis to match the results."
  },
  {
    text: "A journal received two submissions testing whether a new anxiety therapy works. Study A found a significant positive effect (p = .01). Study B found no significant effect (p = .52). The journal published Study A and rejected Study B, saying the null result was 'not of sufficient interest to readers'.",
    options: ["P-hacking", "HARKing", "Publication bias", "Low statistical power"],
    correct: 2,
    correctFeedback: "This is <strong>publication bias</strong> (the 'file drawer problem'). Journals preferentially publishing positive results means the published literature gives a distorted view of reality. Study B's null result is equally informative \u2014 the therapy might genuinely not work.",
    wrongFeedback: "This is <strong>publication bias</strong>. The journal selectively publishes the positive finding and rejects the null result, creating a skewed literature. If 20 labs test the same therapy and only the 1 that gets p < .05 gets published, the public sees a 'proven' treatment that might not work."
  },
  {
    text: "A neuroscience lab's fMRI scanner was producing noisy data for two weeks. Rather than discarding those participants' data and noting the equipment issue, the PI told the research assistant to replace the noisy scans with data copied from other participants who had similar demographic profiles.",
    options: ["P-hacking", "HARKing", "Publication bias", "Fabrication / falsification"],
    correct: 3,
    correctFeedback: "This is <strong>data fabrication/falsification</strong> \u2014 the most serious form of research misconduct. Replacing real data with copied data from other participants is manufacturing false evidence. This constitutes fraud and can lead to retraction, loss of funding, and career consequences.",
    wrongFeedback: "This is <strong>data fabrication/falsification</strong>. Copying data from other participants to replace problematic scans is manufacturing false results \u2014 outright scientific fraud. Unlike p-hacking or HARKing (which are questionable analytic choices), fabrication can lead to formal misconduct investigations."
  },
  {
    text: "A team studying the effects of a cognitive training app planned to test 30 participants. After 18 participants, they checked the p-value and found p = .06. They recruited 8 more, checked again (p = .12), recruited 10 more, and finally got p = .04 with 36 participants. They reported a study with n = 36.",
    options: ["P-hacking (optional stopping)", "HARKing", "Publication bias", "Low statistical power"],
    correct: 0,
    correctFeedback: "This is <strong>p-hacking through optional stopping</strong> \u2014 repeatedly checking significance and adding more data until p < .05. Each interim check inflates the overall false positive rate well beyond 5%. The fix: pre-register a fixed sample size, or use sequential analysis methods that account for repeated testing.",
    wrongFeedback: "This is <strong>p-hacking through optional stopping</strong>. The researchers kept collecting data and checking the p-value, stopping only when they hit significance. Each peek inflates the false positive rate. With enough participants, random noise can eventually produce p < .05 even when there's no real effect."
  }
];

let currentQ = 0;
let score = 0;
let answered = new Array(scenarios.length).fill(null);

function init() {
  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  for (let i = 0; i < scenarios.length; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === 0 ? ' current' : '');
    dot.id = 'dot-' + i;
    dots.appendChild(dot);
  }
  showQuestion(0);
}

function showQuestion(idx) {
  currentQ = idx;
  const s = scenarios[idx];
  const area = document.getElementById('quizArea');

  document.querySelectorAll('.dot').forEach((d, i) => {
    d.className = 'dot';
    if (i === idx) d.classList.add('current');
    if (answered[i] === true) d.classList.add('answered-correct');
    if (answered[i] === false) d.classList.add('answered-wrong');
  });

  let html = '<div class="q-card">';
  html += '<div class="q-number">' + (idx + 1) + '</div>';
  html += '<div class="scenario-text">' + s.text + '</div>';
  html += '<div class="options">';

  const wasAnswered = answered[idx] !== null;
  s.options.forEach((opt, oi) => {
    let cls = 'option-btn';
    if (wasAnswered) {
      if (oi === s.correct) cls += ' correct';
      else cls += (answered[idx] === false ? ' wrong' : ' disabled-neutral');
    }
    const click = wasAnswered ? '' : ' onclick="selectAnswer(' + idx + ',' + oi + ')"';
    html += '<button class="' + cls + '"' + click + '>' + opt + '</button>';
  });
  html += '</div>';

  if (wasAnswered) {
    const isCorrect = answered[idx];
    html += '<div class="feedback ' + (isCorrect ? 'correct-fb' : 'wrong-fb') + '">' + (isCorrect ? s.correctFeedback : s.wrongFeedback) + '</div>';
  }

  html += '</div>';

  html += '<div class="nav-buttons">';
  html += '<button class="nav-btn secondary" ' + (idx === 0 ? 'disabled' : '') + ' onclick="showQuestion(' + (idx - 1) + ')">\u2190 Previous</button>';
  if (idx < scenarios.length - 1) {
    html += '<button class="nav-btn primary" onclick="showQuestion(' + (idx + 1) + ')">Next \u2192</button>';
  } else if (answered.every(a => a !== null)) {
    html += '<button class="nav-btn primary" onclick="showFinal()">See Results \u2192</button>';
  }
  html += '</div>';

  area.innerHTML = html;
}

function selectAnswer(qIdx, optIdx) {
  const s = scenarios[qIdx];
  const isCorrect = optIdx === s.correct;
  answered[qIdx] = isCorrect;
  if (isCorrect) score++;

  document.getElementById('scoreCorrect').textContent = score;
  document.getElementById('scoreTotal').textContent = answered.filter(a => a !== null).length + ' / ' + scenarios.length;

  showQuestion(qIdx);
}

function showFinal() {
  document.getElementById('quizArea').innerHTML = '';
  const final = document.getElementById('finalScreen');
  final.style.display = 'block';
  document.getElementById('finalScore').textContent = score + ' / ' + scenarios.length;

  let trophy, msg;
  if (score === scenarios.length) {
    trophy = '\ud83c\udfc6';
    msg = "Perfect score! You can spot every questionable research practice. You're well-equipped to critically evaluate published research.";
  } else if (score >= 3) {
    trophy = '\u2b50';
    msg = "Good job! You've got a solid understanding of questionable research practices. Review the ones you missed \u2014 the distinctions between p-hacking and HARKing can be subtle.";
  } else {
    trophy = '\ud83d\udca1';
    msg = "These are tricky distinctions! The key thing to remember: <strong>p-hacking</strong> = manipulating analysis to find significance, <strong>HARKing</strong> = changing your hypothesis after seeing results, <strong>publication bias</strong> = systemic preference for positive results, <strong>fabrication</strong> = making up or altering data.";
  }
  document.getElementById('trophy').textContent = trophy;
  document.getElementById('finalMessage').innerHTML = msg;
}

function restartQuiz() {
  score = 0;
  answered = new Array(scenarios.length).fill(null);
  document.getElementById('scoreCorrect').textContent = '0';
  document.getElementById('scoreTotal').textContent = '0 / 5';
  document.getElementById('finalScreen').style.display = 'none';
  init();
}

init();
</script>
</body>
</html>
